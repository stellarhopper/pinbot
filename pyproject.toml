[build-system]
# >=77 for PEP 639 license metadata (the SPDX `license` string below).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-pinball-bot"
version = "0.2.0"
description = "King-of-the-hill pinball tournament bot for Discord"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["discord.py>=2.4"]

[project.optional-dependencies]
# The photo/score cross-check. Absent this, the feature is simply unavailable
# and everything else works unchanged — but note that the Pi deployment installs
# [dev,vision], because a host with a key and no package fails silently.
vision = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # discord.py 2.7 on Python 3.14. Upstream's to fix, and it fires on every
    # command registration, which drowns out warnings that are ours.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # Also discord.py 2.7 on 3.14, from escape_markdown's own re.sub call.
    "ignore:'count' is passed as positional argument:DeprecationWarning",
]

[tool.setuptools]
packages = ["bot"]
